name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: python/ozy-brain

jobs:
  python-tests:
    name: Python Brain Tests & Quality Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.12'

      - name: Run Python Unit Tests
        run: python -m unittest discover -s python/ozy-brain/tests -v

      - name: Run Ozy Brain Evaluation Harness
        run: python python/ozy-brain/tests/eval.py

  rust-matrix:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run Rust workspace tests
        run: cargo test --workspace --all-targets
