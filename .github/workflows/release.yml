name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ozymem-linux-x64
            asset_name: ozymem-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ozymem-windows-x64
            asset_name: ozymem-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ozymem-macos-arm64
            asset_name: ozymem-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ozymem-macos-x64
            asset_name: ozymem-macos-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Standalone Ozy Brain
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e python/ozy-brain
          pyinstaller --clean --noconfirm --distpath dist_brain ozy-brain.spec
          if [ -f "dist_brain/ozy-brain.exe" ]; then
            mkdir -p target/${{ matrix.target }}/release
            cp dist_brain/ozy-brain.exe target/${{ matrix.target }}/release/
          elif [ -f "dist_brain/ozy-brain" ]; then
            mkdir -p target/${{ matrix.target }}/release
            cp dist_brain/ozy-brain target/${{ matrix.target }}/release/
          fi
        continue-on-error: true

      - name: Package Release Assets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ozymem-server dist/
          cp target/${{ matrix.target }}/release/ozymem dist/
          cp target/${{ matrix.target }}/release/ozygram dist/
          if [ -f target/${{ matrix.target }}/release/ozy-brain ]; then
            cp target/${{ matrix.target }}/release/ozy-brain dist/
          fi
          cp install.sh dist/
          cp README.md dist/
          tar -czvf ${{ matrix.asset_name }} -C dist .
          mkdir -p upload
          cp ${{ matrix.asset_name }} upload/

      - name: Package Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/ozymem-server.exe dist/
          Copy-Item target/${{ matrix.target }}/release/ozymem.exe dist/
          Copy-Item target/${{ matrix.target }}/release/ozygram.exe dist/
          if (Test-Path target/${{ matrix.target }}/release/ozy-brain.exe) {
            Copy-Item target/${{ matrix.target }}/release/ozy-brain.exe dist/
            Copy-Item target/${{ matrix.target }}/release/ozy-brain.exe upload/ozy-brain.exe
          }
          Copy-Item install.ps1 dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}
          New-Item -ItemType Directory -Path upload -Force
          Copy-Item ${{ matrix.asset_name }} upload/
          Copy-Item target/${{ matrix.target }}/release/ozygram.exe upload/ozygram.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"
          sed -n "/## \[$VERSION_CLEAN\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            git log -1 --pretty=format:"%b" > release_notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ozymem Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/ozygram.exe
            artifacts/**/ozy-brain.exe
            artifacts/**/ozy-brain
