version: '3.8'

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: ozymem-memgraph
    ports:
      - "7687:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    restart: always

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozymem-server
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - OZYMEM_SERVER_MODE=${OZYMEM_SERVER_MODE}
      - MEMGRAPH_URI=${MEMGRAPH_URI}
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
      - MEMGRAPH_DATABASE=${MEMGRAPH_DATABASE}
    depends_on:
      - memgraph
    restart: always

volumes:
  memgraph-data:
